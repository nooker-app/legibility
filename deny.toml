# `cargo deny check licenses advisories` is PR-blocking (plan D10).
#
# The whole workspace is Apache-2.0 because `legibility-legacy` is a derivative work of
# mozilla/readability (Apache-2.0). Matching the upstream license removes the compatibility
# question entirely rather than requiring anyone to reason about it.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",          # dom_smoothie (transcription attribution, see NOTICE) and most of the ecosystem
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",  # unicode-ident and friends
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# html5ever is pinned exactly: its TreeSink signature has changed across minor versions and
# `legibility-dom` implements that trait directly.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
