# Publish the demo to https://nooker-app.github.io/legibility/ (plan §1.12).
#
# # The isolation this workflow has to preserve
#
# GitHub Pages is per repository, so serving from here cannot reach `nooker-web` or `nook` by
# accident — different repos, different source branches, different paths. There is exactly one way
# to break production, and it is a custom domain: GitHub binds one to a single repository, so a
# CNAME here would move `www.nooker.app` off `nooker-web` and take the site down. `pages-guard.sh`
# fails the build on a CNAME anywhere, and it runs *before* anything is published.
#
# Two smaller disciplines follow from the same worry:
#
#   * the default `GITHUB_TOKEN` with `contents: write` and `pages: read`, and nothing else. No
#     org-scoped PAT and no `repository_dispatch`, so there is no credential in this job that
#     *could* write to another repository even if the steps were wrong — and none that could turn
#     Pages on, which stays a decision a person makes.
#   * `concurrency` keyed to this workflow in this repo, and a force-push that names `gh-pages`
#     explicitly rather than relying on a default.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Read-only, and only to tell "Pages was never enabled" apart from "Pages is enabled and broken".
  # Enabling it is a repository setting and deliberately stays out of this job's reach.
  pages: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the bundle
        run: python3 scripts/build-offline-demo.py dist/index.html

      # Before publishing, not after. A guard that runs on the deployed branch has already let the
      # thing it guards against reach the internet.
      - name: Guards
        run: scripts/pages-guard.sh dist

      # What the bundle *does*, served under a path prefix by a server with no fetch endpoint. The
      # guards above read the file; this one is the only thing that can tell whether the page still
      # extracts and still declines to offer a control that would call this host looking for a
      # helper. Skips itself if no browser is present rather than failing.
      - name: Behaviour
        run: scripts/verify-pages-demo.sh dist

      # A throwaway repository *inside* `dist`, rather than an orphan branch in the checkout. The
      # published tree is then exactly the bundle with no path juggling to get wrong, and there is
      # no sequence of steps here that can commit anything from the source checkout.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The guard checked the worktree, the bundle and the existing branch; this checks what is
          # about to be committed. A CNAME must not exist at any point in the chain.
          if [ -e dist/CNAME ]; then echo "refusing: dist/CNAME"; exit 1; fi
          # `.nojekyll` so Pages serves the tree as-is. Without it Jekyll skips paths it considers
          # special and the failure mode is a silent 404.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "demo: ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages

      # Pushing the branch is not publishing. Which branch Pages serves lives in repo settings and
      # this job has no permission to change it — by design, so that a workflow cannot quietly start
      # publishing a repository that nobody chose to publish.
      #
      # That leaves two states, and they need different answers. **Pages was never enabled** is not a
      # defect in this commit: the bundle is built, guarded and pushed, and there is simply nothing
      # serving it yet. Failing on it would make the build red until a human acts, and a build that
      # is permanently red is a build everyone learns to ignore. **Pages is enabled but not serving
      # our bundle** is a real regression and does fail.
      #
      # The first version of this step could not tell them apart, and turned a correct deploy into a
      # failed run.
      - name: Confirm it is actually served
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          URL=https://nooker-app.github.io/legibility/
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/dev/null; then
            {
              echo "### Bundle pushed to \`gh-pages\` — Pages is not enabled yet"
              echo
              echo "Nothing is wrong with this build. To publish, once:"
              echo "Settings → Pages → Source: *Deploy from a branch*, branch \`gh-pages\`, folder \`/\`."
              echo
              echo "Do **not** set a custom domain: GitHub binds one to a single repository, so it"
              echo "would move \`www.nooker.app\` off \`nooker-web\` and take production down (§1.12.2)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pages not enabled; bundle is on gh-pages and ready."
            exit 0
          fi

          # Enabled. It must serve, and it must not have acquired a custom domain.
          cname=$(jq -r '.cname // "null"' /tmp/pages.json)
          if [ "$cname" != "null" ]; then
            echo "::error::Pages has a custom domain ($cname). See §1.12.2 — this repo must have none."
            exit 1
          fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = 200 ]; then
              echo "$URL is live" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::Pages is enabled but $URL does not serve the bundle"
          exit 1
