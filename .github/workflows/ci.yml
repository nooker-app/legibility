# The checks that decide whether a change is allowed to land.
#
# Everything here ran only on one laptop until now, and this session is the argument for the
# workflow: guarantee S3 — byte-identical output across targets — was broken on **123 of the 130
# corpus pages** for an unknown length of time, and the local gate could not see it because it
# compared a single hand-written fixture. Checks that live on a developer's machine are checks that
# run when someone remembers.
#
# Two jobs rather than one. `gate` is the whole M0 exit gate and is the thing that must be green;
# `macos` exists only for the two legs that need Apple's linker, and is allowed to be slower.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, and the pages workflow is where write access lives.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failed build should say so quickly rather than after a full backtrace-less mystery.
  RUST_BACKTRACE: 1

jobs:
  gate:
    runs-on: ubuntu-latest
    # The default is six hours. Every green run of this job has finished in under seven minutes, so
    # anything past twenty is a hang, and the useful outcome of a hang is a failure now rather than
    # a held runner and a queue behind it. A `Reader view` step once sat at thirty-two minutes with
    # no bound on it at all; the same verification takes 4.5 seconds locally.
    timeout-minutes: 20
    steps:
      # `submodules: recursive` is load-bearing: the corpus is a submodule, and without it the
      # ratchet silently measures zero pages and the S3 leg compares one fixture. Both would pass.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      # Everything cargo builds, keyed on the lockfile. The corpus is a pinned submodule so it needs
      # no cache of its own.
      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked || cargo install cargo-deny

      # The gate runs `cargo test`, clippy, `cargo deny`, the no-recursion and FFI audits, the D9
      # third-party-HTML check, the CNAME guard, and the cross-target S3 comparison over every
      # corpus page. It skips the two iOS legs on Linux and says so.
      - name: M0 exit gate
        run: scripts/m0-gate.sh

      # Separately from the gate, because `chk` swallows output and a ratchet failure has to name
      # the pages that fell. Release, because the corpus run is otherwise slow enough to matter.
      - name: Corpus ratchet
        run: cargo test -p legibility-cli --release --test anchor_band

      # The reader view is what an iOS or macOS app loads into a WKWebView, and only a browser can
      # say whether it works: its first version was refused by its own Content-Security-Policy,
      # because compiling WebAssembly counts as evaluation. A grep would have called that fine.
      - name: Reader view
        run: |
          rustup target add wasm32-unknown-unknown
          # Best-effort and time-boxed. `wasm-opt` only makes the module ~120 KB smaller; the
          # bundle behaves identically without it and the build says so rather than silently
          # shipping a bigger artifact. Unbounded, this line sat eighteen minutes on
          # `archive.ubuntu.com` and took the whole job's twenty-minute budget with it -- an Ubuntu
          # mirror should not be able to fail a gate that tests our own engine.
          timeout 180 sudo apt-get update \
            && timeout 180 sudo apt-get install -y binaryen \
            || echo "::warning::binaryen unavailable; the reader bundle will be larger"
          python3 scripts/build-offline-demo.py --template reader js/reader/reader-bundled.html
          scripts/verify-reader.sh

      - name: Formatting
        run: cargo fmt --all -- --check

  # A short run of each fuzz target on every change. Not to find bugs — that is `fuzz.yml`, nightly,
  # at fifteen minutes a target — but to catch the two failures a scheduled job would report a day
  # late: a target that no longer compiles against the engine, and one that fails on the first input.
  fuzz-smoke:
    runs-on: ubuntu-latest
    # Five targets at 60s each, plus build. Twenty is generous and still bounded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Installed by exact date and used by exact date. No fallback to plain `nightly`: the point
      # of a pin is that everyone builds with the same compiler, and quietly substituting a
      # different one turns a reproducible run into a coincidence.
      - name: Nightly toolchain
        run: |
          NIGHTLY="$(cat nightly-toolchain.txt)"
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || cargo install cargo-fuzz

      - name: Smoke each target
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in extract_bytes sanitize_roundtrip_article sanitize_roundtrip_ugc \
                   structure_aware determinism_differential; do
            echo "::group::$t"
            cargo "+$NIGHTLY" fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048 -malloc_limit_mb=512 -timeout=5
            echo "::endgroup::"
          done

  # The two checks that cannot run on Linux. Kept in their own job so a Linux-only failure is never
  # reported as an iOS problem, and so the expensive runner is not in the critical path.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      # Plan §1.11.5: the point is to learn *now* that a dependency does not build for iOS, rather
      # than in v2 when it is expensive to undo. Building is the whole check; running is v2.
      - name: iOS reachability
        run: |
          cargo build --release -p legibility-core --target aarch64-apple-ios
          cargo build --release -p legibility-core --target aarch64-apple-ios-sim

      - name: FFI audit
        run: python3 scripts/ffi-audit.py
